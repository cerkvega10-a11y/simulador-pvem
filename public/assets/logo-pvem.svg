<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <!-- Símbolo Emblema Tucán / Hoja Verde -->
  <g transform="translate(10, 10)">
    <!-- Círculo fondo esmeralda -->
    <rect width="100" height="100" rx="24" fill="#008f39"/>
    <!-- Hoja / Pico estilizado Tucán PVEM -->
    <path d="M25 75 C 25 35, 60 25, 80 25 C 75 45, 60 65, 30 75 Z" fill="#ffffff" />
    <path d="M40 70 C 40 45, 65 38, 78 30 C 72 50, 60 62, 42 70 Z" fill="#84cc16" />
    <circle cx="38" cy="40" r="4.5" fill="#008f39" />
    <!-- Trazos dinámicos de plumaje / eco -->
    <path d="M45 78 C 65 78, 82 62, 85 45 C 80 68, 60 82, 35 82 Z" fill="#facc15" />
  </g>

  <!-- Tipografía Institucional -->
  <g transform="translate(125, 28)">
    <text x="0" y="24" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="#008f39" letter-spacing="1.2">PARTIDO VERDE</text>
    <text x="0" y="48" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#15803d" letter-spacing="3">ECOLOGISTA DE MÉXICO</text>
    <rect x="0" y="56" width="350" height="3" fill="#84cc16" rx="1.5" />
    <text x="0" y="74" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#0f172a" letter-spacing="2">ESTADO DE MÉXICO</text>
  </g>
</svg>
