  </g>
  <!-- Text -->
  <text x="76" y="32" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="900" fill="#0F172A" letter-spacing="1">COALICIÓN</text>
  <text x="76" y="52" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="800" fill="#0284C7" letter-spacing="1.5">ELECTORAL</text>
  <text x="76" y="66" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="0.5">ALIANZA POR MÉXICO</text>
